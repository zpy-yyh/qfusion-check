[defaults]
# 禁用主机密钥检查（用于测试环境，生产环境应启用）
host_key_checking = False

# 提高并发数
forks = 20

# 显示详细输出
display_skipped_hosts = False

# 使用SSH连接
connection = smart

# 超时设置
timeout = 30

# 角色路径
roles_path = roles

# 清理临时文件
nocows = 1

# 输出格式
stdout_callback = yaml
bin_ansible_callbacks = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
