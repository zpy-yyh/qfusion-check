---
# QFusion 节点清单示例
# 格式说明：
#   - ansible_host: IP地址
#   - ansible_user: SSH用户
#   - ansible_ssh_private_key_file: SSH密钥路径（可选）
#   - ansible_ssh_pass: SSH密码（可选，不推荐，使用密钥更安全）

# 主机组定义
all:
  children:
    # Master节点
    qfusion_masters:
      hosts:
        # 推荐使用SSH密钥认证，密码方式仅作备用
        master1:
          ansible_host: 10.10.156.87
          ansible_user: root
          # ansible_ssh_private_key_file: ~/.ssh/id_rsa
          # ansible_ssh_pass: "your_password_here"  # 不推荐明文密码
        master2:
          ansible_host: 10.10.156.99
          ansible_user: root
          # ansible_ssh_private_key_file: ~/.ssh/id_rsa
          # ansible_ssh_pass: "your_password_here"  # 不推荐明文密码

    # Worker节点
    qfusion_workers:
      hosts: {}

    # 所有QFusion节点
    qfusion_cluster:
      children:
        qfusion_masters:
        qfusion_workers:

# 变量定义（可以覆盖group_vars/all.yml中的值）
qfusion_masters:
  vars:
    node_role: master

qfusion_workers:
  vars:
    node_role: worker
